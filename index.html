<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Book & To Do List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Added header section -->
  <header>
    <h1>My Organizer</h1>
    <nav>
      <button id="tab-address" class="tab-btn active">Address Book</button>
      <button id="tab-todo" class="tab-btn">To Do List</button>
    </nav>
  </header>
<main>
    <!-- Address book section -->
    <section id="section-address" class="tab-content active">
      <!-- Contact Form -->
      <div class="card">
        <h2>Add New Contact</h2>
        <form id="contact-form">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" class="form-input" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name *</label>
              <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-input" placeholder="+254 712 345 678">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" class="form-input" placeholder="john@example.com">
            </div>
          </div>
          <div class="form-group">
            <label for="address">Physical Address</label>
            <input type="text" id="address" class="form-input" placeholder="123 Main Street, Nairobi">
          </div>
          <button type="submit" class="btn-primary">Add Contact</button>
        </form>
      </div>
      <!-- Contact List -->
      <div class="card">
        <h2>Contacts</h2>
        <div id="contact-list">
          <p class="empty-message">No contacts added yet. Add your first contact.</p>
        </div>
      </div>

      <!-- Contact Detail -->
      <div class="card" id="contact-detail-card" style="display:none;">
        <h2>Contact Details</h2>
        <div id="contact-detail-content"></div>
        <button id="close-detail-btn" class="btn-secondary" style="margin-top:1rem;">Back to List</button>
      </div>
    </section>
<!-- To do List Section -->
    <section id="section-todo" class="tab-content">
      <!-- Add New Task Form -->
      <div class="card">
        <h2>Add New Task</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="taskDescription">What do you need to do?</label>
            <input type="text" id="taskDescription" class="form-input" placeholder="Buy groceries..." required>
          </div>
          <button type="submit" class="btn-primary">Add Task</button>
        </form>
      </div>

      <!-- Task List -->
      <div class="card">
        <h2>My Tasks</h2>
        <div id="task-list">
          <p class="empty-message">No tasks added yet. Add your first task above.</p>
        </div>
      </div>
      <!-- Completed Tasks -->
      <div class="card" id="completed-section" style="display:none;">
        <h2>Completed</h2>
        <div id="completed-list"></div>
      </div>
    </section> 
</main>  
</body>
